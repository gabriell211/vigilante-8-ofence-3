name: Inspect authentic stage mesh blocks
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-v82-stage-geometry.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: probe-v82-stage-meshes
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate legacy Unity source inspector
        run: python3 -m unittest discover -s tests -p 'test_stage_geometry_probe.py' -v
      - name: Inspect raw geometry in eight original scenes
        run: python3 scripts/probe_legacy_stage_geometry.py
      - name: Commit verified scene geometry characteristics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/v82-stage-geometry-probe.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(stages): record recoverable TMD mesh streams in all eight legacy maps"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
