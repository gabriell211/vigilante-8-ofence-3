name: Unity PC source and asset audit
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalog-source-and-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate unique characters and vehicles
        run: python3 scripts/validate_catalog.py
      - name: Test data invariants and asset audit
        run: python3 -m unittest discover -s tests -v
      - name: Verify native Windows source contract
        run: python3 scripts/verify_pc_contract.py
      - name: Verify complete upstream V8 Second Offense Unity content archive
        run: python3 scripts/audit_upstream_snapshot.py
      - name: Verify all Classic recomp graphics, mods and tools
        run: python3 scripts/audit_recomp_snapshot.py
      - name: Verify imported genuine FBX vehicle geometry against upstream Git blobs
        run: python3 scripts/verify_imported_models.py
      - name: Verify all official vehicles, stages and source-to-asset coverage
        run: python3 scripts/verify_official_asset_sources.py
      - name: Report real imported Unity prefab coverage
        run: python3 scripts/audit_content.py
