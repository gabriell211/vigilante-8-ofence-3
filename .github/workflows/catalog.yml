name: Unity PC source and asset audit
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalog-source-and-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate unique characters and vehicles
        run: python3 scripts/validate_catalog.py
      - name: Test data invariants and asset audit
        run: python3 -m unittest discover -s tests -v
      - name: Install .NET 10 SDK with matching Roslyn C# runtime
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Validate all active Unity C# scripts for syntax errors
        run: dotnet run --project Tools/UnitySyntaxCheck/UnitySyntaxCheck.csproj -- .
      - name: Verify native Windows source contract
        run: python3 scripts/verify_pc_contract.py
      - name: Verify complete upstream V8 Second Offense Unity content archive
        run: python3 scripts/audit_upstream_snapshot.py
      - name: Verify all Classic recomp graphics, mods and tools
        run: python3 scripts/audit_recomp_snapshot.py
      - name: Verify imported genuine FBX vehicle geometry against upstream Git blobs
        run: python3 scripts/verify_imported_models.py
      - name: Verify all official vehicles, stages and source-to-asset coverage
        run: python3 scripts/verify_official_asset_sources.py
      - name: Confirm 18 original per-vehicle handling profiles against GameManager source
        run: python3 scripts/extract_v82_handling.py --check
      - name: Validate exact original extracted vehicle meshes
        run: python3 scripts/verify_extracted_geometry.py
      - name: Validate 790 imported original textures and Unity GUIDs
        run: python3 scripts/verify_legacy_textures.py
      - name: Validate 18 real textured PS1 model previews
        run: python3 scripts/verify_tmd_previews.py
      - name: Verify all original 235 WAV files, GUIDs and Unity audio bank mappings
        run: python3 scripts/verify_legacy_audio.py
      - name: Validate Unity 6 direct mesh import contract against all source OBJ and MTL
        run: python3 scripts/verify_unity_mesh_sources.py
      - name: Validate the seven authentic native V82 Geo Mesh files and source GUIDs
        run: python3 scripts/verify_v82_original_terrain.py
      - name: Verify authentic stage object banks for all eight V82 levels
        run: python3 scripts/export_v82_stage_banks.py --check
      - name: Verify all eight original V82 stage scene source hashes
        run: python3 scripts/verify_legacy_stages.py
      - name: Extract original Unity scene local transforms with parent file IDs
        run: python3 scripts/audit_legacy_v82_scene_layouts.py --json > v82-original-local-transform-evidence.json
      - name: Resolve original parent-rotation-scale hierarchy to world translation evidence
        run: python3 scripts/resolve_v82_scene_hierarchy.py --json > v82-original-world-transform-evidence.json
      - name: Store original world translations (NOT verified prop placement or spawns)
        uses: actions/upload-artifact@v4
        with:
          name: v82-original-world-transform-evidence
          path: v82-original-world-transform-evidence.json
          if-no-files-found: error
      - name: Store authentic local-transform evidence (NOT a playable stage)
        uses: actions/upload-artifact@v4
        with:
          name: v82-original-local-transform-evidence
          path: v82-original-local-transform-evidence.json
          if-no-files-found: error
      - name: Cross-reference actual scene VigMesh component GUIDs and XOBF TMD groups
        run: python3 scripts/audit_v82_scene_mesh_references.py --json > v82-original-scene-mesh-crosswalk.json
      - name: Save original source scene-to-TMD references (NOT playable)
        uses: actions/upload-artifact@v4
        with:
          name: v82-original-scene-mesh-crosswalk
          path: v82-original-scene-mesh-crosswalk.json
          if-no-files-found: error
      - name: Cross-check original JUNC fixed-point coordinates with source XOBF mesh references
        run: python3 scripts/audit_v82_junction_fixed_positions.py --json > v82-original-junction-fixed-position-evidence.json
      - name: Preserve true JUNC source coordinates (not production placement)
        uses: actions/upload-artifact@v4
        with:
          name: v82-original-junction-fixed-positions
          path: v82-original-junction-fixed-position-evidence.json
          if-no-files-found: error
      - name: Recover original V82 RSEG-to-JUNC road graph and source curve evidence
        run: python3 scripts/audit_v82_road_segments.py --json > v82-original-road-segment-graph.json
      - name: Store authenticated RSEG fixed-point graph (NOT playable roads)
        uses: actions/upload-artifact@v4
        with:
          name: v82-original-road-segment-graph
          path: v82-original-road-segment-graph.json
          if-no-files-found: error
      - name: Recheck real 8-stage geometry source discovery against original Unity scenes
        run: python3 scripts/verify_stage_geometry_probe.py
      - name: Report real imported Unity prefab coverage
        run: python3 scripts/audit_content.py
