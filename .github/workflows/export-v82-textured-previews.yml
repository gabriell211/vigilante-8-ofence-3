name: Generate original-texture vehicle previews
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-v82-textured-previews.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: original-textured-v82-preview
  cancel-in-progress: false

jobs:
  generate-preview-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Verify original texture conversion mappings
        run: |
          python3 -m unittest discover -s tests -p 'test_tmd_uvs.py' -v
          python3 scripts/verify_legacy_textures.py
      - name: Generate PS1 polygon OBJ and MTL with original texture links
        run: python3 scripts/export_legacy_uvs.py
      - name: Verify all 18 vehicle previews against original geometry
        run: python3 scripts/verify_tmd_previews.py
      - name: Commit original materials and geometry previews to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all Assets/GameContent/TexturedPreviewV82
          if git diff --cached --quiet; then
            echo "All preview sources already match."
            exit 0
          fi
          git commit -m "assets(v82): generate 18 real geometry and source-texture previews"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
