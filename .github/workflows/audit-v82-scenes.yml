name: Audit 8 actual Vigilante 8 2nd Offense stage source scenes
on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-v82-scenes.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: audit-legacy-v82-stages
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Test source scene parser
        run: python3 -m unittest discover -s tests -p 'test_legacy_stages.py' -v
      - name: Audit all eight original Unity source scenes
        run: python3 scripts/audit_legacy_stages.py
      - name: Verify source scene SHA256 hashes
        run: python3 scripts/verify_legacy_stages.py
      - name: Commit evidence manifest without a loose PR
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all Assets/GameContent/LegacyStageManifests/scene-audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "assets(v82): index all eight genuine legacy scenes and their SHA256"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
